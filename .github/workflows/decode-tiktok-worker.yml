name: Decode TikTok worker

on:
  push:
    branches:
      - tiktok-direct-post-build
    paths:
      - .github/workflows/decode-tiktok-worker.yml

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tiktok-direct-post-build

      - name: Decode worker
        run: |
          mkdir -p tiktok-direct-post
          base64 --decode tiktok-direct-post/worker.js.gz.b64 | gunzip > tiktok-direct-post/worker.js
          test -s tiktok-direct-post/worker.js
          node --check tiktok-direct-post/worker.js
          wc -l tiktok-direct-post/worker.js

      - name: Commit decoded worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiktok-direct-post/worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Add decoded TikTok Direct Post worker"
          git push origin HEAD:tiktok-direct-post-build
